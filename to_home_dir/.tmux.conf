#
# KEY BINDINGS (Prefix is 'C-a')
#
# - `prefix + r` - reload tmux config
# - `prefix + v` - capture text to vim !!!
# - `prefix + I` - Installs new plugins
# - `prefix + U` - Updates plugin(s)
# - `prefix + C-s` - save tmux window layout
# - `prefix + C-r` - restore tmux window layout
# - `Shift+Option+Arrow` - switch pane (preserves zoom state)
#
# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Set the default leader key
#set -g prefix C-b

# Bind an additional leader key since C-b is hard to reach
set -g prefix2 C-a

# split panes using | and \, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind "\\" split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# enable extended key sequences (required for Shift+Option combos)
set -s extended-keys on

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

#Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Shift+Option+Arrow: switch panes preserving zoom state (no prefix)
# When zoomed: unzoom → select → rezoom (single render pass, no flicker)
# When not zoomed: plain select-pane
bind -n M-S-Left  if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z ; select-pane -L ; resize-pane -Z' 'select-pane -L'
bind -n M-S-Right if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z ; select-pane -R ; resize-pane -Z' 'select-pane -R'
bind -n M-S-Up    if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z ; select-pane -U ; resize-pane -Z' 'select-pane -U'
bind -n M-S-Down  if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z ; select-pane -D ; resize-pane -Z' 'select-pane -D'

# enable vi mode keys
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# set default terminal mode to 256 colors
#set -g default-terminal "screen-256color"
# Enable true color inside tmux
#set-option -sa terminal-overrides ",xterm*:Tc"

# Tell apps inside tmux it's a 256-color tmux session
set -g default-terminal "tmux-256color"
# Tell tmux that the *outside* terminal (iTerm2/xterm-256color) supports TrueColor (RGB)
set-option -ga terminal-features ",xterm-256color:RGB"


set-option -g focus-events on
set -g set-clipboard on

# Allow passthrough for image display (required for image.nvim in kitty/sixel terminals)
set -g allow-passthrough on

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

bind v 'capture-pane' \; \
  capture-pane -S - \; \
  save-buffer /tmp/tmux \; \
  delete-buffer \; \
  send-keys ' nvim /tmp/tmux' Enter

#
# Colors and status line adapted from:
# http://zanshin.net/2013/09/05/my-tmux-configuration/
#
# Remove or comment out everything below this line for stock colors and status
# bar layout.
#

# ----------------------
# set some pretty colors
# ----------------------
# Alternate background
# set -g window-style 'fg=colour231,bg=colour237'
set -g pane-border-lines double
set -g pane-border-style "bg=default fg=green"
set -g pane-active-border-style "bg=default fg=red"
# Show a title on each pane border. Prefer the per-pane @chain user option
# (set by the overseer fleet, immune to the claude TUI's OSC title clobber);
# fall back to the process-set pane_title otherwise.
set -g pane-border-status top
set -g pane-border-format ' #{?@chain,#{@chain},#{pane_title}} '

# ----------------------
# Status Bar
# -----------------------
set-option -g status on                # turn the status bar on
set -g status-interval 5               # set update frequencey (default 15 seconds)
set -g status-justify centre           # center window list for clarity
# set-option -g status-position top    # position the status bar at top of screen

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# highlight the CURRENT window in the status bar (reverse video) so it stands
# out regardless of activity flags on other windows. Without an explicit
# window-status-current-style, tmux falls back to window-status-style for
# BOTH current and non-current windows, so they look identical UNLESS a
# background window has pending activity (monitor-activity above) — in a busy
# multi-window session that meant every OTHER window looked highlighted while
# the current one (which never flags its own activity) looked plain, i.e.
# backwards from the expected "current window stands out" convention.
#
# GOTCHA: tmux's built-in window-status-activity-style default is ALSO
# "reverse" — identical to what we just set for the current window. In a
# session where most/all windows have near-constant background activity
# (e.g. a fleet of chains all producing output), every window ends up
# reverse-video and the current one is no longer distinguishable. Give
# activity its own distinct (non-reverse) style so the two signals don't
# collide: current window = reverse, active-but-not-current = colored.
set -g window-status-current-style "reverse"
set -g window-status-activity-style "fg=colour208,bg=default"

# set color for status bar
set-option -g status-bg colour240 #base02
set-option -g status-fg yellow #yellow

# Set tmux variables for IP addresses on startup
run-shell "tmux set -g @ip0 \"$(ip addr show scope global | grep -m1 'inet[^6]' | tail -n1 | awk '{print $2}')\""
run-shell "tmux set -g @ip1 \"$(ip addr show scope global | grep -m2 'inet[^6]' | tail -n1 | awk '{print $2}')\""

# show host name and IP address on left side of status bar
set -g status-left-length 70
set -g status-left "#[fg=green]#h #[fg=brightblue]#{@ip0} #[fg=yellow]#{@ip1}"

# show session name, window & pane number, date and time on right side of
# status bar
set -g status-right-length 60
set -g status-right "#[fg=blue]#S #I:#P #[fg=green]%k:%M:%S (#(date -u | awk '{print $4}') UTC)"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
